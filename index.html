<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MordorOT</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    background: radial-gradient(1200px 600px at 50% -10%, #4a1206 0%, #1a0a06 45%, #0b0705 100%);
    color: #f3e3c8;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main { width: min(560px, 92vw); padding: 40px 28px; text-align: center; }
  h1 {
    margin: 0 0 6px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(34px, 7vw, 56px);
    letter-spacing: 2px;
    color: #ffcf7a;
    text-shadow: 0 0 28px rgba(255, 96, 24, .45), 0 2px 0 #6b2a10;
  }
  p { margin: 0 0 30px; color: #cbb79a; line-height: 1.6; }
  .acoes { display: grid; gap: 12px; }
  a.botao {
    display: block; padding: 16px 20px; border-radius: 10px;
    text-decoration: none; font-weight: 600; letter-spacing: .4px;
    border: 1px solid #7a3a1a; color: #ffe7c2;
    background: linear-gradient(#3a170c, #26100a);
    transition: transform .12s ease, border-color .12s ease;
  }
  a.botao:hover { transform: translateY(-2px); border-color: #ff9d4d; }
  a.principal {
    background: linear-gradient(#b8481a, #7d2b0f);
    border-color: #ffb066; color: #fff6e6;
  }
  footer { margin-top: 26px; font-size: 12px; color: #8d7a63; }
</style>
</head>
<body>
<main>
  <h1>MordorOT</h1>
  <p>Servidor de mundo aberto. Crie sua conta, baixe o cliente e entre para jogar.</p>
  <div class="acoes">
    <a class="botao principal" href="/site/">Entrar no site</a>
    <a class="botao" href="/site/downloads.html">Baixar o jogo</a>
  </div>
  <footer>Contas, ranking e novidades ficam no site.</footer>
</main>
</body>
</html>
